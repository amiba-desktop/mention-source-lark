name: lark
version: 0.5.0
description: >
  Feishu (Lark) resources as mention sources. Exposes a `search` capability
  (over the lark-cli subprocess) for group chats, people, and docs, and ships
  an agent-side resolver skill so the agent can act on the handles those
  mentions produce. HTTP-agnostic — the backplane's mention-sources gateway
  adapts `search` into GET /mention-sources/lark/search.

# Capability: async search(rtype, query, limit) -> {ok, items:[{id,title,detail,payload}]}
# rtype is one of the mention_resource types below (doc | chat | user).

# Mentionable resources contributed to GET /hermes/mention-resources.
# Each becomes a generic @-provider in the composer: registry key
# "lark.<type>", search via /mention-sources/lark/search?type=<type>. A picked
# resource expands into a self-describing reference line the agent resolves with
# `resolver_skill`. The line FORMAT is owned by the composer (host) —
# "(<label>: <name> · <handle…>)" — so every source reads identically; a source
# only declares `label` + `fields` (the name is the first display field, the
# handles are the rest), it does NOT define the format.
#
# `group` is the composer @-menu section header each type is filed under
# (raw label, clustered by exact string — matching another source's string
# joins its section). Omit it to fall back to a top-level source `group`
# default (if set), then to the source name. Here we give each type its
# own section.
#
# `requires_query: true` — this type's search can't list a default set (Feishu
# doc/contact search demands a keyword). On an empty query the composer shows
# `empty_hint` as the category's empty state instead of an empty group. `chat`
# omits it: it lists the user's joined groups on an empty query (see source.py).
mention_resources:
  - type: doc
    label: 飞书文档
    icon: lark-doc
    group: 飞书文档
    fields: [url, title]
    requires_query: true
    empty_hint: 输入关键词搜索飞书文档
  - type: chat
    label: 飞书群
    icon: lark-chat
    group: 飞书群聊
    fields: [chat_id, name]
  - type: user
    label: 飞书联系人
    icon: lark-user
    group: 飞书联系人
    fields: [p2p_chat_id, name]
    requires_query: true
    empty_hint: 输入姓名搜索飞书联系人

resolver_skill: skills/lark-resolve.md

requires:
  binaries: [lark-cli]
